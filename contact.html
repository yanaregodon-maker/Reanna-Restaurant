<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reanna Restaurant</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="icon" type="img/jpg" href="./img/logo.png" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="container">
          <div class="logo">
            <a href="./index.html">Reanna Restaurant</a>
          </div>
          <ul class="nav-links">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./about.html">About</a></li>
            <li><a href="./menu.html">Menu</a></li>
            <li><a href="./contact.html" class="active">Contact</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <section class="contact">
        <div class="container">
          <h1>Contact Us</h1>
          <div class="contact-details">
            <p>
              <strong>Address:</strong> National Highway Brgy Tuburan, Pagadian
              City, ZDS, Ph
            </p>
            <p><strong>Phone:</strong> (+63) 9631335518</p>
            <p><strong>Email:</strong>reanna_restaurant.com</p>
          </div>

          <form action="#" method="post" class="contact-form">
            <label for="name">Name:</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="enter your email"
            /><br />
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="enter your email"
            />
            <label for="message">Message</label>
            <textarea
              name="message"
              id="message"
              placeholder="Enter your message"
              required
            ></textarea>

            <div class="button-group">
              <button type="submit">Submit</button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <footer>
      <div class="container">
        <p>&copy;2026 Reanna Restaurant. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
